name: Build and Push vcfliftover Docker Image

on:
  push:
    branches:
      - dev
    paths:
      - 'docker/vcfliftover/Dockerfile'
      - 'docker/vcfliftover/conda.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rlinder02/vcfliftover

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get current version and increment
        id: version
        run: |
          # Get the current latest version tag from Docker Hub
          CURRENT_VERSION=$(curl -s "https://registry.hub.docker.com/v2/repositories/${{ env.IMAGE_NAME }}/tags/" | \
            jq -r '.results[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name' | \
            sort -V | tail -1)
          
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            # If no version found, start with v0.0.1
            NEW_VERSION="v0.0.1"
          else
            # Extract version numbers and increment patch version
            MAJOR=$(echo $CURRENT_VERSION | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
            MINOR=$(echo $CURRENT_VERSION | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
            PATCH=$(echo $CURRENT_VERSION | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          
          echo "current_version=${CURRENT_VERSION:-v0.0.0}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Incrementing from ${CURRENT_VERSION:-v0.0.0} to ${NEW_VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.new_version }}
            type=raw,value=latest

      - name: Build Docker image for testing
        id: build-test
        uses: docker/build-push-action@v5
        with:
          context: ./docker/vcfliftover
          file: ./docker/vcfliftover/Dockerfile
          load: true
          tags: test-image:latest
          cache-from: type=gha

      - name: Test Docker image
        run: |
          # Test that bcftools is installed and working
          docker run --rm test-image:latest bcftools --version
          
          # Test that the liftover plugin is available
          docker run --rm test-image:latest bcftools plugin -l | grep liftover
          
          # Test that required dependencies are available
          docker run --rm test-image:latest which wget
          
          # Test that the SCORE plugin directory exists
          docker run --rm test-image:latest ls -la /usr/local/libexec/bcftools/
          
          echo "✅ All tests passed! Image is ready for push."

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./docker/vcfliftover
          file: ./docker/vcfliftover/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract new image tag
        id: tag
        run: |
          # Use the new incremented version
          NEW_TAG=${{ steps.version.outputs.new_version }}
          echo "new_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${NEW_TAG}" >> $GITHUB_OUTPUT

      - name: Update container references in modules
        run: |
          # Update liftover.nf
          sed -i "s|'docker.io/rlinder02/vcfliftover:.*'|'${{ steps.tag.outputs.full_image }}'|g" modules/local/liftover.nf
          sed -i "s|'https://docker.io/rlinder02/vcfliftover:.*'|'https://${{ steps.tag.outputs.full_image }}'|g" modules/local/liftover.nf
          
          # Update concatvcf.nf  
          sed -i "s|'docker.io/rlinder02/vcfliftover:.*'|'${{ steps.tag.outputs.full_image }}'|g" modules/local/concatvcf.nf
          sed -i "s|'https://docker.io/rlinder02/vcfliftover:.*'|'https://${{ steps.tag.outputs.full_image }}'|g" modules/local/concatvcf.nf

      - name: Commit and push updated container references
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes to commit
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Add and commit changes
          git add modules/local/liftover.nf modules/local/concatvcf.nf
          git commit -m "Update vcfliftover container to ${{ steps.tag.outputs.new_tag }}
          
          - Updated container references in liftover.nf and concatvcf.nf
          - New image: ${{ steps.tag.outputs.full_image }}
          
          🤖 Generated with GitHub Actions"
          
          # Push changes to dev branch
          git push origin dev